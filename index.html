", "d": "劳动与职场", "qt": "计算题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "被单位裁员或辞退的劳动者", "ck": "2026-10-05", "a": "拿 N、N+1 还是 2N，不看公司嘴上说的是\"裁员\"还是\"优化\"，看它凭什么让你走、程序走没走对。", "u": "题库/劳动与职场/0018.md"}, {"no": "0019", "t": "被违法辞退，是要求回去上班，还是拿两倍赔偿？", "d": "劳动与职场", "qt": "选择题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "被公司违法解除或终止合同的劳动者", "ck": "2026-10-05", "a": "合同还能履行，才由你挑。", "u": "题库/劳动与职场/0019.md"}, {"no": "0020", "t": "被欠薪了，先投诉还是先仲裁？", "d": "劳动与职场", "qt": "选择题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "被拖欠工资的劳动者", "ck": "2026-10-17", "a": "先看公司认不认这个数。", "u": "题库/劳动与职场/0020.md"}, {"no": "0021", "t": "离职多久之内还能申请劳动仲裁？", "d": "劳动与职场", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "官方解释", "bw": "最高人民法院的典型案例", "who": "要申请劳动仲裁的劳动者", "ck": "2026-10-05", "a": "你和公司有劳动关系，欠你的工资和加班费就从劳动关系结束那天起算一年，一年内去申请仲裁；劳动关系还在的时候，拖了多久都不受这一年的限制。", "u": "题库/劳动与职场/0021.md"}, {"no": "0022", "t": "从入职到离职，哪些东西一定要留作证据？", "d": "劳动与职场", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "上班的劳动者", "ck": "2026-10-05", "a": "从入职那天起就自己留，别想着真闹起来再让公司拿出来。", "u": "题库/劳动与职场/0022.md"}, {"no": "0023", "t": "入职一个多月了公司还没签合同，我能要求什么？", "d": "劳动与职场", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "入职未签书面合同的全日制员工", "ck": "2026-10-05", "a": "你能要两样：让公司跟你补签书面合同，再把二倍工资里没发的那部分要回来。", "u": "题库/劳动与职场/0023.md"}, {"no": "0024", "t": "试用期最长能约多久？能不能约两次？", "d": "劳动与职场", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "与公司签劳动合同的上班族", "ck": "2026-10-05", "a": "最长 6 个月，而且同一家公司对同一个人只能约一次，试用期过完了再来一轮是不行的。", "u": "题库/劳动与职场/0024.md"}, {"no": "0025", "t": "竞业限制协议签了，公司不给补偿怎么办？", "d": "劳动与职场", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "离职后被拖欠约定竞业补偿的人", "ck": "2026-10-05", "a": "补偿照约定找公司要，但在竞业约定解除之前，别急着去同行上班。", "u": "题库/劳动与职场/0025.md"}, {"no": "0026", "t": "公司扣我工资，最多能扣多少？", "d": "劳动与职场", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "被要求扣工资赔损失的职工", "ck": "2026-10-05", "a": "公司要你赔损失、从工资里扣，全国的规定是每个月最多扣当月工资的20%，而且扣完剩下的不能低于当地月最低工资，两道限哪道紧按哪道；在广东、江苏上班的，本省条例写法不一样，得先问清当地按哪份办。", "u": "题库/劳动与职场/0026.md"}, {"no": "0027", "t": "平时、周末、法定节假日加班，加班费各是多少？", "d": "劳动与职场", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "标准工时、按时间计薪的职工", "ck": "2026-10-05", "a": "三个数记住就行：平时下班后被公司安排接着干，至少给你小时工资的 150%；休息日被叫去上班，公司又安排不了补休的，至少给 200%；法定节假日上班，至少给 300%，而且这 300% 是在当天的正常工资之外另给的。", "u": "题库/劳动与职场/0027.md"}, {"no": "0028", "t": "周末加班，公司说“给你调休”就可以不给钱吗？", "d": "劳动与职场", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "实行标准工时的上班族", "ck": "2026-10-05", "a": "标准工时下，休息日加班可以不给钱，但调休得真落到日子上，而且补的时间要跟你加班的时间一样长。", "u": "题库/劳动与职场/0028.md"}, {"no": "0029", "t": "公司让我签“自愿放弃社保”的声明，签了算数吗？", "d": "劳动与职场", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "被要求放弃社保的职工", "ck": "2026-10-05", "a": "不算数，签了也白签。", "u": "题库/劳动与职场/0029.md"}, {"no": "0030", "t": "公司没和我商量就调岗降薪，怎么拒绝？", "d": "劳动与职场", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "遇到公司调岗降薪的职工", "ck": "2026-10-05", "a": "公司发一张调岗降薪的通知，不等于你同意了。", "u": "题库/劳动与职场/0030.md"}, {"no": "0031", "t": "保质期没过就一定能吃吗？", "d": "饮食与健康习惯", "qt": "判断题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "官方文件原文", "who": "吃预包装食品的人", "ck": "2026-10-07", "a": "不一定。", "u": "题库/饮食与健康习惯/0031.md"}, {"no": "0032", "t": "做好的饭菜在桌上能放多久？", "d": "饮食与健康习惯", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "权威机构指南", "who": "在家做饭吃饭的人", "ck": "2026-10-05", "a": "最多 2 小时。", "u": "题库/饮食与健康习惯/0032.md"}, {"no": "0033", "t": "冰箱冷藏室应该调到几度？", "d": "饮食与健康习惯", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "权威机构指南", "who": "在家用冰箱存放食物的人", "ck": "2026-10-05", "a": "调到冷藏室里实际是0℃～4℃，这是国家食品安全风险评估中心给家里存食物的建议。", "u": "题库/饮食与健康习惯/0033.md"}, {"no": "0034", "t": "剩菜要热到什么程度才能吃？", "d": "饮食与健康习惯", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "权威机构指南", "who": "在家热剩菜的人", "ck": "2026-10-05", "a": "要热到整份冒热气才算，切开或拨开中间也得看到热气往上冒，光把菜温一温、摸着不凉不行。", "u": "题库/饮食与健康习惯/0034.md"}, {"no": "0035", "t": "四季豆没炒熟为什么会中毒？", "d": "饮食与健康习惯", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "官方解释", "bw": "主管部门的答复和解读", "who": "在家做四季豆的人", "ck": "2026-10-05", "a": "四季豆没炒熟会中毒，是因为豆子本身带着两种天然毒素，红细胞凝集素和皂苷。", "u": "题库/饮食与健康习惯/0035.md"}, {"no": "0036", "t": "泡了一夜的木耳还能吃吗？", "d": "饮食与健康习惯", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "权威机构指南", "who": "在家泡发干木耳的人", "ck": "2026-10-05", "a": "在厨房台面上泡了一整夜的木耳，倒掉，别心疼。", "u": "题库/饮食与健康习惯/0036.md"}, {"no": "0037", "t": "配料表里排在前面的配料，是含量最多的吗？", "d": "饮食与健康习惯", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "买预包装食品的人", "ck": "2026-10-05", "a": "不能直接这么认。", "u": "题库/饮食与健康习惯/0037.md"}, {"no": "0038", "t": "营养成分表里的\"NRV%\"是什么意思？", "d": "饮食与健康习惯", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "官方文件原文", "who": "购买普通预包装食品的人", "ck": "2026-10-05", "a": "NRV% 是表里那一行的含量占国家统一参考值的百分比，看的是这份食品给一天宜摄入的总量贡献了多少，跟这种成分占食品多重没有关系。", "u": "题库/饮食与健康习惯/0038.md"}, {"no": "0039", "t": "一天吃多少盐算超标？", "d": "饮食与健康习惯", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "权威机构指南", "who": "想控制食盐摄入的成年人", "ck": "2026-10-05", "a": "成年人一天吃进嘴里的盐，超过5克就算超了。", "u": "题库/饮食与健康习惯/0039.md"}, {"no": "0040", "t": "微信号怎么注销？注销之前要先处理什么？", "d": "常用平台的规则", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "官方解释", "bw": "平台的帮助说明", "who": "想注销微信号的人", "ck": "2026-10-05", "a": "微信号在手机上自己就能注销：点\"我\"，再点\"设置\"、\"账号安全\"、\"微信安全中心\"、\"注销账号\"，看完页面上的说明点\"申请注销\"，申请就提交了。", "u": "题库/常用平台的规则/0040.md"}, {"no": "0041", "t": "在京东刚买完就降价了，怎么要回差价？", "d": "常用平台的规则", "qt": "判断题", "lv": "简单", "g": "少花钱", "b": "官方解释", "bw": "平台的帮助说明", "who": "在京东买东西的人", "ck": "2026-10-17", "a": "能要，而且不用求客服，在京东App首页的搜索框搜“价保”，进“价格保护”自己申请就行。", "u": "题库/常用平台的规则/0041.md"}, {"no": "0042", "t": "和公司协商一致离职的，怎么领失业金？", "d": "养老失业工伤保险", "qt": "选择题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "已缴满一年失业保险的职工", "ck": "2026-10-05", "a": "能不能领，先看是谁提的离职。", "u": "题库/养老失业工伤保险/0042.md"}, {"no": "0043", "t": "被裁了，失业金怎么领？过了 60 天也能", "d": "养老失业工伤保险", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "被单位裁员的职工", "ck": "2026-10-05", "a": "被裁之后，带上社保卡或身份证，去参保地的经办机构现场办或者网上申请就行，过了 60 天也照样去，经办机构不能拿\"超过 60 天\"拒发。", "u": "题库/养老失业工伤保险/0043.md"}, {"no": "0044", "t": "公司是不是按低工资给我交社保？怎么查？", "d": "养老失业工伤保险", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "在公司参加职工养老保险的人", "ck": "2026-10-06", "a": "社保记录上的养老保险基数比你这个月到手的工资低，单凭这一点说明不了公司压低了你的基数。", "u": "题库/养老失业工伤保险/0044.md"}, {"no": "0045", "t": "跨省换工作，养老保险怎么转？", "d": "养老失业工伤保险", "qt": "问答题", "lv": "中等", "g": "省时间", "b": "官方解释", "bw": "主管部门的答复和解读", "who": "跨省换工作的企业职工", "ck": "2026-10-06", "a": "能转，原来交的也不会作废：几个省交的年限合在一起算，个人账户里的钱累计算，只有同一段时间两边重复交的那部分年限不算。", "u": "题库/养老失业工伤保险/0045.md"}, {"no": "0046", "t": "我到底哪一年退休？怎么算？", "d": "养老失业工伤保险", "qt": "问答题", "lv": "中等", "g": "省时间", "b": "原文", "bw": "法规原文", "who": "查询职工法定退休年月的人", "ck": "2026-10-06", "a": "你哪年哪月退休，得查表，靠一句\"延到63岁\"算不出来。", "u": "题库/养老失业工伤保险/0046.md"}, {"no": "0047", "t": "没有单位，怎么在工作的城市交职工社保？", "d": "养老失业工伤保险", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "没有单位的灵活就业人员", "ck": "2026-10-06", "a": "没有单位也能交，你以个人身份去参保，钱自己出，能这样交的是职工养老保险和职工医保这两样。", "u": "题库/养老失业工伤保险/0047.md"}, {"no": "0048", "t": "个人养老金是不是只有退休才能取？", "d": "养老失业工伤保险", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "官方文件原文", "who": "已缴存个人养老金的人", "ck": "2026-10-06", "a": "不是。", "u": "题库/养老失业工伤保险/0048.md"}, {"no": "0049", "t": "上下班路上出了事故，算不算工伤？", "d": "养老失业工伤保险", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "上下班途中受伤的职工", "ck": "2026-10-06", "a": "算，但有几道门槛。", "u": "题库/养老失业工伤保险/0049.md"}, {"no": "0050", "t": "受了工伤公司不给报，我自己怎么申请？多久之内？", "d": "养老失业工伤保险", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "公司未申报工伤的职工", "ck": "2026-10-06", "a": "公司不给报，你自己去报，别等它。", "u": "题库/养老失业工伤保险/0050.md"}, {"no": "0051", "t": "换工作中间空了几个月，医保断了怎么办？", "d": "医保生育与就医", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "跨地区换工作、医保断了几个月的职工", "ck": "2026-10-05", "a": "没退休、跨统筹地区换工作，前后都交职工医保的，断了不超过3个月，问题不大：到新地方参上职工医保以后，去办医保关系转移，按那边的规定把空档补缴上，补完不设等待期，缴费当月就能用，断掉那几个月的待遇也可以按规定追溯享受。", "u": "题库/医保生育与就医/0051.md"}, {"no": "0052", "t": "孩子上学、家里有 3 岁以下的宝宝，各能抵多少税？", "d": "个税与常见税费", "qt": "计算题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "有综合所得的父母", "ck": "2026-10-05", "a": "两项一样，都是每个孩子每月 2000 元，但这 2000 元是从你要交税的那部分收入里减掉的，不是每个月少交 2000 元税，汇算时也不会按这个数退给你。", "u": "题库/个税与常见税费/0052.md"}, {"no": "0053", "t": "年终奖单独计税，还是并入工资一起算？", "d": "个税与常见税费", "qt": "选择题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "取得全年一次性奖金的居民个人", "ck": "2026-10-05", "a": "别凭感觉选，两种都算一遍，哪种全年一共交的税少就选哪种。", "u": "题库/个税与常见税费/0053.md"}, {"no": "0054", "t": "租房怎么少交个税？每月能扣多少？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "租房的居民个人", "ck": "2026-10-06", "a": "在上班的城市没有自己的房、又在租房住，就能每月扣一个固定的数：直辖市、省会（首府）城市、计划单列市和国务院确定的其他城市是1500元，其余城市里市辖区户籍人口超过100万的是1100元，不超过100万的是800元。", "u": "题库/个税与常见税费/0054.md"}, {"no": "0055", "t": "有房贷，每月能抵多少税？能抵多少年？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "有首套房贷的居民个人", "ck": "2026-10-06", "a": "符合条件的首套房贷，全额扣除每月是1000元，但这1000元是从你要交税的收入里减掉的，不是直接少交1000元税。", "u": "题库/个税与常见税费/0055.md"}, {"no": "0056", "t": "赡养父母能抵多少税？兄弟姐妹之间怎么分？", "d": "个税与常见税费", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "赡养父母、申报综合所得的居民个人", "ck": "2026-10-06", "a": "父母里只要有一位满了60岁，你是独生子女，每月就能扣3000元。", "u": "题库/个税与常见税费/0056.md"}, {"no": "0057", "t": "夫妻俩，孩子的扣除一个人全拿还是各拿一半更省？", "d": "个税与常见税费", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "法规原文", "who": "可享受子女教育扣除的居民个人夫妻", "ck": "2026-10-06", "a": "没有一个固定的答案，得拿你们俩自己的数算。", "u": "题库/个税与常见税费/0057.md"}, {"no": "0058", "t": "一年看病自己掏了不少钱，怎么抵税？", "d": "个税与常见税费", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "有综合所得的居民个人", "ck": "2026-10-06", "a": "能抵，办法是第二年办个税汇算时填一项大病医疗扣除，但抵的不是你掏的全部医药费，也不是扣多少就退多少。", "u": "题库/个税与常见税费/0058.md"}, {"no": "0059", "t": "个税的扣除项忘了填，怎么补？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "漏填专项附加扣除的居民个人", "ck": "2026-10-06", "a": "能补，而且有两条路。", "u": "题库/个税与常见税费/0059.md"}, {"no": "0060", "t": "每年的个税汇算，我要不要办？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "取得境内综合所得的居民个人", "ck": "2026-10-06", "a": "要不要办，看你这一年的税是交多了还是交少了。", "u": "题库/个税与常见税费/0060.md"}, {"no": "0061", "t": "个税汇算多缴的税，怎么申请退回来？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "办综合所得汇算的居民个人", "ck": "2026-10-06", "a": "能退，退的是多交的那一部分：全年已经预缴的税，减去汇算下来实际该交的税。", "u": "题库/个税与常见税费/0061.md"}, {"no": "0062", "t": "做兼职被预扣了 20% 的税，怎么退回来？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "兼职按劳务报酬预扣的居民个人", "ck": "2026-10-06", "a": "能退，办法是在拿到这笔钱的第二年3月1日到6月30日，自己去办个税的年度汇算。", "u": "题库/个税与常见税费/0062.md"}, {"no": "0063", "t": "个人养老金能少交多少税，划不划算？", "d": "个税与常见税费", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "考虑缴存个人养老金的人", "ck": "2026-10-06", "a": "能少交多少，取决于你扣这笔养老金之前的全年应纳税所得额，不是年薪。", "u": "题库/个税与常见税费/0063.md"}, {"no": "0064", "t": "自动续费被悄悄扣钱，平台有没有义务提前提醒？", "d": "电信与数字权益", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "被平台自动续费的人", "ck": "2026-10-06", "a": "有，而且不是开通时提醒一次就完了。", "u": "题库/电信与数字权益/0064.md"}, {"no": "0065", "t": "亲人去世了，能去银行查他账户里的钱和流水吗？", "d": "养老照护身后事救助", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "办理亲人身后事的人", "ck": "2026-10-17", "a": "能查，而且查余额比多数人想的省事。", "u": "题库/养老照护身后事救助/0065.md"}, {"no": "0066", "t": "亲人留下的股票，不做公证能过户吗？", "d": "养老照护身后事救助", "qt": "问答题", "lv": "中等", "g": "省时间", "b": "原文", "bw": "官方文件原文", "who": "亲人留下股票的继承人", "ck": "2026-10-17", "a": "能，继承公证不是非办不可，不做公证的路有两条，走法很不一样。", "u": "题库/养老照护身后事救助/0066.md"}, {"no": "0067", "t": "亲人去世了，他的公积金能取出来吗？", "d": "养老照护身后事救助", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "需要办理已故亲人住房公积金提取的继承人、受遗赠人", "ck": "2026-10-17", "a": "能取。", "u": "题库/养老照护身后事救助/0067.md"}, {"no": "0068", "t": "突然遇到急难，没钱看病吃饭，怎么申请临时救助？", "d": "养老照护身后事救助", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "遭遇急难、基本生活暂时严重困难的人", "ck": "2026-10-17", "a": "直接去出事那个地方的乡镇政府或者街道办申请，别等，人在外地出的事也在出事的地方申请，不用回老家。", "u": "题库/养老照护身后事救助/0068.md"}, {"no": "0069", "t": "办丧事，殡仪馆的哪些收费我可以不交？", "d": "养老照护身后事救助", "qt": "问答题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "法规原文", "who": "为亲属办理丧事的人", "ck": "2026-10-17", "a": "清单之外的项目、没按规定公示的收费、标价之外加的钱、被捆绑硬塞给你的用品和服务，这几类你都可以不交。", "u": "题库/养老照护身后事救助/0069.md"}, {"no": "0070", "t": "驾照快到期了，怎么换？", "d": "车辆与交通", "qt": "问答题", "lv": "简单", "g": "省时间", "b": "原文", "bw": "法规原文", "who": "驾驶证快到期的机动车驾驶人", "ck": "2026-10-17", "a": "进了到期前90天这个窗口就去换，不用专门跑回发证的地方。", "u": "题库/车辆与交通/0070.md"}, {"no": "0071", "t": "驾照的分快扣完了，怎么减分？", "d": "车辆与交通", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "驾驶证已有交通违法记分、处理完记录后仍未满12分的机动车驾驶人", "ck": "2026-10-17", "a": "能减，靠参加交管部门组织的学习考试或者交通安全公益活动，一个记分周期最多减 6 分。", "u": "题库/车辆与交通/0071.md"}, {"no": "0072", "t": "收到违章短信，多久之内要处理？", "d": "车辆与交通", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "收到交通违法短信的驾驶人、车主和车辆管理人", "ck": "2026-10-17", "a": "电子眼拍的违章，短信给你的期限是 30 天，在这 30 天里去接受处理就行，不用当天就慌着缴钱。", "u": "题库/车辆与交通/0072.md"}, {"no": "0073", "t": "出了车祸报了保险，保险公司最晚多久要赔？", "d": "车辆与交通", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "发生交通事故后向保险公司索赔的车主", "ck": "2026-10-17", "a": "没有一个从报案那天倒数的最晚到账日。", "u": "题库/车辆与交通/0073.md"}, {"no": "0074", "t": "驾照记满 12 分，怎么学习、考试拿回来？", "d": "车辆与交通", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "一个记分周期内驾照记满12分的人", "ck": "2026-10-17", "a": "开小车、这个记分周期第一次满分、累计还不到24分的，学七天，考过交通法规考试，再把罚款交清，驾照就还给你。", "u": "题库/车辆与交通/0074.md"}, {"no": "0075", "t": "交强险最多能赔多少？", "d": "车辆与交通", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "机动车驾驶人和交通事故受害人", "ck": "2026-10-17", "a": "交强险的“20万元”是你有责任时三项加起来的总数，单拿哪一项出来都到不了20万元。", "u": "题库/车辆与交通/0075.md"}, {"no": "0076", "t": "对方逃逸或没保险，抢救费谁先垫？", "d": "车辆与交通", "qt": "问答题", "lv": "困难", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "机动车交通事故中需要垫付抢救费的伤者及亲属", "ck": "2026-10-17", "a": "先垫的是道路交通事故社会救助基金，出钱的是事故发生地的救助基金管理机构，而且医院不能因为抢救费还没交就拖着不救。", "u": "题库/车辆与交通/0076.md"}, {"no": "0077", "t": "买新能源车，购置税减半怎么算？", "d": "车辆与交通", "qt": "计算题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "准备购买新能源汽车的人", "ck": "2026-10-17", "a": "先拿车价里不含增值税的那部分乘 10%，算出原本该交的购置税，再减掉一半，但减掉的这一半最多 1.5 万元。", "u": "题库/车辆与交通/0077.md"}, {"no": "0078", "t": "健身房的年卡、次卡不想用了，能退多少？", "d": "消费与合同", "qt": "计算题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "想退健身年卡或次卡的消费者", "ck": "2026-10-07", "a": "能退多少，先看两件事：合同能不能解除，你手里是哪种卡。", "u": "题库/消费与合同/0078.md"}, {"no": "0079", "t": "健身卡不想用了，怎么转给别人？", "d": "消费与合同", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "想把健身卡转给别人的消费者", "ck": "2026-10-17", "a": "卡能依法转的，你找好接手的人，把转让的事通知健身房就行，不用等它点头。", "u": "题库/消费与合同/0079.md"}, {"no": "0080", "t": "买到假药、劣药，能赔多少？", "d": "消费与合同", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "为自己或者家人生活消费买到假药、劣药的人", "ck": "2026-10-17", "a": "能要两笔钱。", "u": "题库/消费与合同/0080.md"}, {"no": "0081", "t": "用的东西有缺陷把人伤了，能要哪些赔偿？", "d": "消费与合同", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "因缺陷产品受到人身伤害的人及死亡受害人的近亲属", "ck": "2026-10-17", "a": "能要的远不止医药费。", "u": "题库/消费与合同/0081.md"}, {"no": "0082", "t": "被商家坑了，去 12315 该投诉还是举报？", "d": "消费与合同", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "与商家发生消费争议的人", "ck": "2026-10-17", "a": "看你要的是什么。", "u": "题库/消费与合同/0082.md"}, {"no": "0083", "t": "签满两次固定期限合同，第三次公司不签无固定期限合同，我能要什么？", "d": "程序员专题", "qt": "问答题", "lv": "困难", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "连续两次固定期限合同后被单位拒签的职工", "ck": "2026-10-17", "a": "能要的东西不少，先看公司拒签之后是还让你干，还是让你走。", "u": "题库/程序员专题/0083.md"}, {"no": "0084", "t": "就业报到证取消了，毕业手续现在怎么办？", "d": "上学资助与职业资格", "qt": "问答题", "lv": "中等", "g": "省时间", "b": "原文", "bw": "官方文件原文", "who": "普通高校毕业生", "ck": "2026-10-07", "a": "报到证从 2023 年起就不发了，补办和改派也一起取消，你不用找人去补。", "u": "题库/上学资助与职业资格/0084.md"}, {"no": "0085", "t": "换了工作，人事档案要不要跟着转？", "d": "上学资助与职业资格", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "换工作或跨地区就业，需要判断是否迁转人事档案的人", "ck": "2026-10-17", "a": "不一定要转，先看两件事：档案现在放在哪儿，新工作是什么单位。", "u": "题库/上学资助与职业资格/0085.md"}, {"no": "0086", "t": "结婚登记必须回户籍地、带户口簿吗？", "d": "婚姻生育养育", "qt": "问答题", "lv": "简单", "g": "省时间", "b": "官方解释", "bw": "主管部门的答复和解读", "who": "准备登记结婚的内地居民", "ck": "2026-10-07", "a": "不用。", "u": "题库/婚姻生育养育/0086.md"}, {"no": "0087", "t": "父母出钱给我买房，离婚时这套房怎么分？", "d": "婚姻生育养育", "qt": "问答题", "lv": "困难", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "父母出资购房的已婚子女", "ck": "2026-10-07", "a": "不是一人一半，要看父母是什么时候出的钱、出了多少、当时说没说送给谁。", "u": "题库/婚姻生育养育/0087.md"}, {"no": "0088", "t": "婚前买的房，婚后加了对方的名字，离婚时怎么分？", "d": "婚姻生育养育", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "婚前房屋婚后给配偶加名的夫妻", "ck": "2026-10-17", "a": "加了名不等于离婚就一人一半。", "u": "题库/婚姻生育养育/0088.md"}, {"no": "0089", "t": "国家育儿补贴每年 3600 元，怎么领？", "d": "婚姻生育养育", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "官方文件原文", "who": "需要申领国家育儿补贴的婴幼儿家庭及其他监护人", "ck": "2026-10-17", "a": "由爸爸或妈妈中的一个人，向孩子户口所在的地方申请，网上在支付宝、微信的\"育儿补贴\"小程序或者孩子户籍所在省份的政务服务平台就能办，不会弄的去孩子户籍地的乡镇政府或街道办事处当面办。", "u": "题库/婚姻生育养育/0089.md"}, {"no": "0090", "t": "领证没多久就离了，彩礼能要回来吗？", "d": "婚姻生育养育", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "领证后短期离婚、涉及彩礼返还的人", "ck": "2026-10-17", "a": "要不要得回来，不看领证多久，看你们有没有真的一起过日子。", "u": "题库/婚姻生育养育/0090.md"}, {"no": "0091", "t": "分居满一年、两年，就能判离婚吗？", "d": "婚姻生育养育", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "想了解分居是否满足判离条件的夫妻", "ck": "2026-10-17", "a": "光分开住够时间，婚离不掉，法院也不是到了日子就判。", "u": "题库/婚姻生育养育/0091.md"}, {"no": "0092", "t": "银行倒闭了，我的存款能拿回多少？", "d": "银行支付征信保险", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "在银行存款的个人", "ck": "2026-10-07", "a": "50 万元以内一分不少拿回来，超出的那部分要从银行清算出来的财产里去分。", "u": "题库/银行支付征信保险/0092.md"}, {"no": "0093", "t": "银行卡被盗刷，银行说“密码是对的”就可以不赔吗？", "d": "银行支付征信保险", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "银行卡发生疑似盗刷的持卡人", "ck": "2026-10-07", "a": "不能。", "u": "题库/银行支付征信保险/0093.md"}, {"no": "0094", "t": "征信上的逾期记录要留多久？", "d": "银行支付征信保险", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "征信报告上有个人逾期记录的人", "ck": "2026-10-07", "a": "5 年，一般是从这笔欠款还清那天往后数，不是从逾期那天数。", "u": "题库/银行支付征信保险/0094.md"}, {"no": "0095", "t": "怎么免费查自己的征信？一年能查几次？", "d": "银行支付征信保险", "qt": "问答题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "需要查看本人信用报告的个人", "ck": "2026-10-07", "a": "想看自己的信用报告，在网上查就行，不要钱。", "u": "题库/银行支付征信保险/0095.md"}, {"no": "0096", "t": "贷款广告说“日息万分之一”，年化到底是多少？", "d": "银行支付征信保险", "qt": "计算题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "准备贷款的人", "ck": "2026-10-07", "a": "本金全年不变、无其他费用，日息万分之一按365天单利算，年化是3.65%。", "u": "题库/银行支付征信保险/0096.md"}, {"no": "0097", "t": "银行卡被盗刷了，银行或支付平台承诺过“先行赔付”，怎么让它先赔？", "d": "银行支付征信保险", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "遭遇银行卡网络盗刷的持卡人", "ck": "2026-10-17", "a": "能要，而且这句承诺在法院那里算数。", "u": "题库/银行支付征信保险/0097.md"}, {"no": "0098", "t": "开卡时银行没告诉我开通了网上支付，被盗刷了我也要担责吗？", "d": "银行支付征信保险", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "遭遇网络盗刷的银行卡持卡人", "ck": "2026-10-17", "a": "银行在你开卡或者给你开通网上支付的时候没告诉你有这项功能，事后又拿不出你同意用它的证据，这笔网上盗刷的责任你可以不担，告到法院也是支持你的。", "u": "题库/银行支付征信保险/0098.md"}, {"no": "0099", "t": "给人做担保，合同没写是哪种保证，我要担连带责任吗？", "d": "银行支付征信保险", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "给他人提供保证的人", "ck": "2026-10-17", "a": "合同里对保证方式真没约定，或者约定得不明确，按民法典你担的是一般保证，不是连带。", "u": "题库/银行支付征信保险/0099.md"}, {"no": "0100", "t": "征信上\"连三累六\"，还能贷款吗？", "d": "银行支付征信保险", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "官方解释", "bw": "主管部门的答复和解读", "who": "有逾期记录、准备向商业银行申请贷款的人", "ck": "2026-10-17", "a": "向商业银行申请贷款，不一定贷不到。", "u": "题库/银行支付征信保险/0100.md"}, {"no": "0101", "t": "租房押金，房东凭什么扣？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "面临退租押金扣款的租客", "ck": "2026-10-07", "a": "房东扣押金，先得看合同。", "u": "题库/租房买房公积金/0101.md"}, {"no": "0102", "t": "房东不退押金，怎么要回来？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "遇到房东不退押金的租客", "ck": "2026-10-07", "a": "先别急着找人评理，第一步是把租房合同翻出来，看押金那几行怎么写的。", "u": "题库/租房买房公积金/0102.md"}, {"no": "0103", "t": "租的房子漏水、热水器坏了，谁修、谁出钱？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "遇到房屋或出租设施故障的租客", "ck": "2026-10-07", "a": "房子漏水、房东配的热水器坏了，该房东修，钱也该房东出，这是法律压在房东身上的义务。", "u": "题库/租房买房公积金/0103.md"}, {"no": "0104", "t": "房东要卖房，我的租约还算数吗？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "租期内遇到房东卖房的租客", "ck": "2026-10-07", "a": "算数。", "u": "题库/租房买房公积金/0104.md"}, {"no": "0105", "t": "买新房交了定金，后来没谈拢，定金能退吗？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "已交购房定金的人", "ck": "2026-10-07", "a": "不一定丢，要看正式合同没签成是谁的原因。", "u": "题库/租房买房公积金/0105.md"}, {"no": "0106", "t": "开发商逾期交房，违约金怎么算？", "d": "租房买房公积金", "qt": "计算题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "遭遇开发商逾期交房的购房人", "ck": "2026-10-07", "a": "先翻购房合同。", "u": "题库/租房买房公积金/0106.md"}, {"no": "0107", "t": "开发商逾期交房，多久之后我可以退房？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "遇到开发商逾期交房的购房人", "ck": "2026-10-07", "a": "从你催开发商交房那天算起，三个月它还不交，你就可以要求退房，法院会支持；合同里另外约定了退房条件的，按合同来。", "u": "题库/租房买房公积金/0107.md"}, {"no": "0108", "t": "提前还房贷，能省多少利息？", "d": "租房买房公积金", "qt": "计算题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "法规原文", "who": "想提前还房贷的人", "ck": "2026-10-07", "a": "省多少没有一个通用的数，但算法很清楚：选定提前还款生效的那一天，把原来那份还款计划从这天往后的利息加起来，再把还完以后的新计划从这天往后的利息加起来，两个数一减，就是省下的利息。", "u": "题库/租房买房公积金/0108.md"}, {"no": "0109", "t": "公积金除了买房，还有哪些情况能提出来？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "住房公积金缴存职工", "ck": "2026-10-07", "a": "能提的远不止买房。", "u": "题库/租房买房公积金/0109.md"}, {"no": "0110", "t": "买二手房交了定金，没谈拢，定金能退吗？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "已向个人卖家交款的二手房买家", "ck": "2026-10-17", "a": "能不能退，看的是没签成怪谁，不看你签没签正式合同。", "u": "题库/租房买房公积金/0110.md"}, {"no": "0111", "t": "房东要卖我租的房子，我怎么优先买？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "租赁房屋拟被出售且有意购买的承租人", "ck": "2026-10-17", "a": "你能优先买，但只是在同等条件下：别人出什么价、什么付款安排，你照同样的条件买，房东就得先卖给你，租着这套房换不来便宜。", "u": "题库/租房买房公积金/0111.md"}, {"no": "0112", "t": "没到期就想退租，要赔多少、押金能退吗？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "固定租期未到，因自身原因提前退租并构成违约的住房承租人", "ck": "2026-10-17", "a": "提前退租构成违约的，全国没有\"提前退租就赔一个月房租\"这条规矩，赔多少先看合同：写了违约金，从那个数出发；写了损失怎么算，照那个算法；都没写，就按房东因为你提前走实际受的损失算。", "u": "题库/租房买房公积金/0112.md"}, {"no": "0113", "t": "换城市工作，公积金怎么转到新城市？", "d": "租房买房公积金", "qt": "问答题", "lv": "中等", "g": "省时间", "b": "官方解释", "bw": "主管部门的答复和解读", "who": "换城市工作并继续缴存公积金的职工", "ck": "2026-10-17", "a": "不用回原城市跑。", "u": "题库/租房买房公积金/0113.md"}, {"no": "0114", "t": "申请提取公积金，多少天内必须给我办好？", "d": "租房买房公积金", "qt": "问答题", "lv": "简单", "g": "省时间", "b": "原文", "bw": "法规原文", "who": "申请提取住房公积金的职工", "ck": "2026-10-17", "a": "法定的数是3日，但这3日管的是给你一个决定，不是把钱打到你卡上。", "u": "题库/租房买房公积金/0114.md"}, {"no": "0115", "t": "病假最长能请多久？医疗期怎么算？", "d": "劳动与职场", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "因患病或非因工负伤需要停工治病休息的企业职工", "ck": "2026-10-07", "a": "一次病假能批多久，看医生开的病休建议和公司的请假制度；大家嘴里说的\"病假最长能请几个月\"，其实说的是医疗期。", "u": "题库/劳动与职场/0115.md"}, {"no": "0116", "t": "医疗期内公司能不能辞退我？", "d": "劳动与职场", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "医疗期内被公司要求离职的职工", "ck": "2026-10-07", "a": "多数情况下不能。", "u": "题库/劳动与职场/0116.md"}, {"no": "0117", "t": "医疗期满了还不能上班，公司怎么处理、要给多少钱？", "d": "劳动与职场", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "医疗期满仍不能工作的职工", "ck": "2026-10-07", "a": "全日制上班的人，医疗期满后原来的工作和公司另外安排的工作都干不了，身上又没有孕期、哺乳期这类法律特别保护的情形，公司才可以辞退你，走也要给钱。", "u": "题库/劳动与职场/0117.md"}, {"no": "0118", "t": "到了退休年龄还在上班，公司要不要跟我签协议、给我交工伤保险？", "d": "劳动与职场", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "超过法定退休年龄仍被单位招用的劳动者，以及符合规定已提前退休后再就业的劳动者", "ck": "2026-10-17", "a": "要签，也要交。", "u": "题库/劳动与职场/0118.md"}, {"no": "0119", "t": "公司倒闭、解散或被吊销执照，经济补偿怎么拿？", "d": "劳动与职场", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "公司关闭或解散的职工", "ck": "2026-10-17", "a": "公司被依法宣告破产、吊销营业执照、责令关闭、撤销，或者自己决定提前解散，劳动合同就跟着终止了，公司照样得给你经济补偿。", "u": "题库/劳动与职场/0119.md"}, {"no": "0120", "t": "劳动合同到期，公司不续签，有没有补偿？", "d": "劳动与职场", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "劳动合同到期、公司不续签的职工", "ck": "2026-10-17", "a": "有。", "u": "题库/劳动与职场/0120.md"}, {"no": "0121", "t": "公司单方面给我降薪，我辞职能要补偿吗？", "d": "劳动与职场", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "被公司单方降薪、考虑离职的劳动者", "ck": "2026-10-17", "a": "能要，但不是一辞职就有，得同时占住两点：公司确实少发了合同里约定的工资，而且你是因为这个通知公司解除合同的。", "u": "题库/劳动与职场/0121.md"}, {"no": "0122", "t": "起诉要回一笔钱，诉讼费要交多少？", "d": "法律救济证件公共服务", "qt": "计算题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "准备起诉追讨债款的人", "ck": "2026-10-17", "a": "起诉追讨普通债款，你先要准备的是案件受理费，要 10 万元，标准受理费是 2300 元。", "u": "题库/法律救济证件公共服务/0122.md"}, {"no": "0123", "t": "交不起诉讼费，怎么申请少交、晚交或者不交？", "d": "法律救济证件公共服务", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "法规原文", "who": "交纳诉讼费用确有困难的当事人", "ck": "2026-10-17", "a": "起诉或者上诉的时候，把一份书面申请和证明你确实交不起的材料一起交给法院，申请缓交、减交或者免交，这叫诉讼费的司法救助。", "u": "题库/法律救济证件公共服务/0123.md"}, {"no": "0124", "t": "要的钱不多，起诉能走小额诉讼吗？", "d": "法律救济证件公共服务", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "准备起诉追讨小额款项的人", "ck": "2026-10-17", "a": "在基层法院或者它派出的法庭起诉，钱少只是条件之一，能不能走小额诉讼，要看三件事同时成不成立。", "u": "题库/法律救济证件公共服务/0124.md"}, {"no": "0125", "t": "借给别人的钱拖了三年多没还，还能要回来吗？", "d": "法律救济证件公共服务", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "借给别人钱、对方长期未还的人", "ck": "2026-10-17", "a": "多半还能要，先别认栽。", "u": "题库/法律救济证件公共服务/0125.md"}, {"no": "0126", "t": "身份证丢了，怎么补办？", "d": "法律救济证件公共服务", "qt": "问答题", "lv": "中等", "g": "省时间", "b": "原文", "bw": "官方文件原文", "who": "身份证丢失的中国公民", "ck": "2026-10-17", "a": "丢了就去补，人在外省、符合异地受理条件的，不用专门回老家。", "u": "题库/法律救济证件公共服务/0126.md"}, {"no": "0127", "t": "收到法院传票，15 天内要做什么？", "d": "法律救济证件公共服务", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "收到法院诉讼文书的民事一审被告", "ck": "2026-10-17", "a": "先把起点弄对：这十五天是从你收到起诉状副本的次日算的，不是从传票到手那天算。", "u": "题库/法律救济证件公共服务/0127.md"}, {"no": "0128", "t": "民间借贷的利息最高多少算合法？", "d": "法律救济证件公共服务", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "民间借贷的借款人和出借人", "ck": "2026-10-17", "a": "民间借贷没有一个固定的年利率上限，法院支持的约定利率最高到借款合同成立那时候一年期LPR的四倍，超出的那部分利息，出借人去法院要也不支持。", "u": "题库/法律救济证件公共服务/0128.md"}, {"no": "0129", "t": "官司赢了对方不给钱，多久内要申请强制执行？", "d": "法律救济证件公共服务", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "取得生效民事给付法律文书、对方未履行的当事人", "ck": "2026-10-17", "a": "两年。", "u": "题库/法律救济证件公共服务/0129.md"}, {"no": "0130", "t": "一天吃多少糖算超标？", "d": "饮食与健康习惯", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "权威机构指南", "who": "健康成年人", "ck": "2026-10-07", "a": "一天的添加糖过了50克，就超了中国居民膳食指南给健康成年人的上限；指南还说，最好控制在25克以下。", "u": "题库/饮食与健康习惯/0130.md"}, {"no": "0131", "t": "剩菜要等放凉了再进冰箱吗？", "d": "饮食与健康习惯", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "权威机构指南", "who": "在家留存剩菜剩饭的人", "ck": "2026-10-07", "a": "不用等凉透，也别一出锅就热着往里塞。", "u": "题库/饮食与健康习惯/0131.md"}, {"no": "0132", "t": "电动自行车能不能推进楼道充电？", "d": "居家安全应急与日常", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "官方文件原文", "who": "使用电动自行车的人", "ck": "2026-10-07", "a": "不能，而且不光是不能充，车推进去不插电、光停着也不行。", "u": "题库/居家安全应急与日常/0132.md"}, {"no": "0133", "t": "被猫狗抓伤咬伤，第一步做什么？", "d": "居家安全应急与日常", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "官方文件原文", "who": "被猫狗抓伤或咬伤的人", "ck": "2026-10-07", "a": "新近的普通皮肤伤口，先冲洗，不是先去打针。", "u": "题库/居家安全应急与日常/0133.md"}, {"no": "0134", "t": "烫伤了能不能涂牙膏？", "d": "居家安全应急与日常", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "官方解释", "bw": "主管部门的答复和解读", "who": "刚发生烫伤的人及施救者", "ck": "2026-10-07", "a": "不能涂。", "u": "题库/居家安全应急与日常/0134.md"}, {"no": "0135", "t": "打过狂犬疫苗，又被猫狗咬了，还要再打吗？", "d": "居家安全应急与日常", "qt": "问答题", "lv": "中等", "g": "更安全健康", "b": "原文", "bw": "官方文件原文", "who": "打过狂犬病疫苗后又被猫狗咬伤的人", "ck": "2026-10-17", "a": "要不要再打，看你上一轮打到了哪一步、打完隔了多久。", "u": "题库/居家安全应急与日常/0135.md"}, {"no": "0136", "t": "被猫狗咬了，要不要打破伤风针？", "d": "居家安全应急与日常", "qt": "问答题", "lv": "中等", "g": "更安全健康", "b": "原文", "bw": "官方文件原文", "who": "被猫狗咬伤的人", "ck": "2026-10-17", "a": "不一定要打，关键看你以前打过几针含破伤风成分的疫苗、最后一针离现在多久。", "u": "题库/居家安全应急与日常/0136.md"}, {"no": "0137", "t": "电动自行车能不能推回家里、拎电池上楼充电？", "d": "居家安全应急与日常", "qt": "问答题", "lv": "简单", "g": "更安全健康", "b": "原文", "bw": "权威机构指南", "who": "电动自行车使用者", "ck": "2026-10-17", "a": "不能，整车不行，拆下来的电池也不行。", "u": "题库/居家安全应急与日常/0137.md"}, {"no": "0138", "t": "居住证每年什么时候签注？晚了会怎样？", "d": "户籍居住证与常住地服务", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "在外地连续居住的居住证持有人", "ck": "2026-10-07", "a": "居住证每年要签注一次，时间是你在这个城市居住每满一年的那天之前的一个月里。", "u": "题库/户籍居住证与常住地服务/0138.md"}, {"no": "0139", "t": "在京东的第三方店铺买东西，卖家不处理售后，怎么让京东介入？", "d": "常用平台的规则", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "官方解释", "bw": "平台的帮助说明", "who": "在京东第三方店铺售后受阻的买家", "ck": "2026-10-07", "a": "要让京东介入，得你自己去申请纠纷单，而且有 15 天的窗口，过了这个窗口入口就关了。", "u": "题库/常用平台的规则/0139.md"}, {"no": "0140", "t": "微信转错了账，怎么追回来？", "d": "常用平台的规则", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "微信转错账的人", "ck": "2026-10-07", "a": "撤是撤不回了，但还能争取把钱要回来，先看对方收没收。", "u": "题库/常用平台的规则/0140.md"}, {"no": "0141", "t": "苹果的免费试用，要在到期前多久取消才不会被扣费？", "d": "常用平台的规则", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "平台规则原文", "who": "不想让苹果免费试用转为付费订阅的人", "ck": "2026-10-07", "a": "至少提前 24 小时，到期那天才取消就晚了。", "u": "题库/常用平台的规则/0141.md"}, {"no": "0142", "t": "App Store 扣了我的钱，怎么申请退款？", "d": "常用平台的规则", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "官方解释", "bw": "平台的帮助说明", "who": "被 Apple 扣费、想申请退款的人", "ck": "2026-10-07", "a": "去 reportaproblem.apple.com 登录，点“我需要”，选“请求退款”，选原因，再选要退的那一项提交。", "u": "题库/常用平台的规则/0142.md"}, {"no": "0143", "t": "孩子拿我的苹果手机乱买东西，怎么提前防住？", "d": "常用平台的规则", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "官方解释", "bw": "平台的帮助说明", "who": "会把自己的 iPhone 交给孩子的家长", "ck": "2026-10-07", "a": "两样一起设，基本就防住了。", "u": "题库/常用平台的规则/0143.md"}, {"no": "0144", "t": "家人去世了，他的微信号能继承吗？", "d": "常用平台的规则", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "平台规则原文", "who": "去世微信用户的家人", "ck": "2026-10-07", "a": "不能。", "u": "题库/常用平台的规则/0144.md"}, {"no": "0145", "t": "我不在了，苹果账号里的照片谁能拿到？要提前设置什么？", "d": "常用平台的规则", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "官方解释", "bw": "平台的帮助说明", "who": "想提前安排身后苹果账户照片访问的人", "ck": "2026-10-07", "a": "能拿到照片的，是你生前自己指定的遗产联系人，所以要提前做的就两件事：在手机设置里加一个遗产联系人，再把系统生成的访问密钥交到对方手里。", "u": "题库/常用平台的规则/0145.md"}, {"no": "0146", "t": "极兔的快递坏了或者丢了，要在多久之内反馈？", "d": "常用平台的规则", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "官方解释", "bw": "平台的帮助说明", "who": "极兔快件的寄件人、指定受益人和收件人", "ck": "2026-10-07", "a": "签收以后才发现东西坏了的，从签收算起 24 小时内就要找极兔反馈，这是极兔官网极速理赔帮助说明里的说法。", "u": "题库/常用平台的规则/0146.md"}, {"no": "0147", "t": "极兔的快递丢了，没保价，最多能赔多少？", "d": "常用平台的规则", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "平台规则原文", "who": "极兔国内快件丢失且未保价的寄件人", "ck": "2026-10-17", "a": "没保价，极兔按它运单条款里的规矩赔：在十倍运费以内，赔你东西的实际损失。", "u": "题库/常用平台的规则/0147.md"}, {"no": "0148", "t": "快递公司不处理我的理赔，去哪投诉？", "d": "常用平台的规则", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "官方文件原文", "who": "快递理赔投诉未解决的用户", "ck": "2026-10-17", "a": "快递公司拖着不给你理赔，就去邮政管理部门申诉，但前提是你先正式向快递公司投诉过。", "u": "题库/常用平台的规则/0148.md"}, {"no": "0149", "t": "家人去世了，生前没设遗产联系人，怎么拿到他苹果账号里的照片？", "d": "常用平台的规则", "qt": "问答题", "lv": "困难", "g": "避免损失", "b": "官方解释", "bw": "平台的帮助说明", "who": "想取回已故亲人账户照片的人", "ck": "2026-10-17", "a": "没设遗产联系人，照片也还有路可走，你可以向 Apple 申请访问他的账户。", "u": "题库/常用平台的规则/0149.md"}, {"no": "0150", "t": "退休想提前或推迟几年，自己能定吗？", "d": "养老失业工伤保险", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "临近退休的职工", "ck": "2026-10-07", "a": "早退基本是你自己拿主意，晚退得单位点头。", "u": "题库/养老失业工伤保险/0150.md"}, {"no": "0151", "t": "跨过省换过工作，退休时在哪领养老金？", "d": "养老失业工伤保险", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "跨省参加城镇企业职工养老保险的人", "ck": "2026-10-07", "a": "在哪领养老金，跟你最后在哪个省上班没有直接关系，看的是两样东西：你的养老保险关系现在落在哪个省，你在每个省各交了多少年。", "u": "题库/养老失业工伤保险/0151.md"}, {"no": "0152", "t": "退休早几年、晚几年，每月养老金差多少？", "d": "养老失业工伤保险",  "ck": "2026-10-17", "a": "能给，前提是你交的是职工医保，他是你的近亲属，而且他自己也参了医保，职工医保或城乡居民医保都算。", "u": "题库/医保生育与就医/0160.md"}, {"no": "0161", "t": "赡养父母的个税扣除，兄弟姐妹之间怎么分更省？", "d": "个税与常见税费", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "法规原文", "who": "共同赡养父母的非独生子女", "ck": "2026-10-07", "a": "只有两个人分，最省的分法不用算：各扣每月1500元，把3000元用满就到顶了。", "u": "题库/个税与常见税费/0161.md"}, {"no": "0162", "t": "去年的个税退税和扣除项过了期限，怎么补？", "d": "个税与常见税费", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "漏报专项附加扣除或错过汇算的纳税人", "ck": "2026-10-07", "a": "多半还能补，但要回到漏掉的那一年去补，不能挪到今年扣。", "u": "题库/个税与常见税费/0162.md"}, {"no": "0163", "t": "同一年先租房后买房，房租和房贷的扣除怎么算？", "d": "个税与常见税费", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "官方解释", "bw": "主管部门的答复和解读", "who": "同年先租房后买房的纳税人", "ck": "2026-10-17", "a": "稳妥的做法是这一年在房租和房贷利息里只挑一项报，按这一项符合条件的月份算，两项不相加。", "u": "题库/个税与常见税费/0163.md"}, {"no": "0164", "t": "自动续费没提醒就扣了钱，能要回来吗？", "d": "电信与数字权益", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "官方解释", "bw": "最高人民法院的典型案例", "who": "自动续费被扣款的消费者", "ck": "2026-10-17", "a": "能要，而且你手里的理由站得住。", "u": "题库/电信与数字权益/0164.md"}, {"no": "0165", "t": "火车票什么时候退最划算？", "d": "出行与旅游", "qt": "问答题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "平台规则原文", "who": "要取消火车行程的人", "ck": "2026-10-07", "a": "确定不去了就马上退，最划算的是在开车前8天及以上退，一分钱不扣。", "u": "题库/出行与旅游/0165.md"}, {"no": "0166", "t": "火车票是退了重买，还是改签？", "d": "出行与旅游", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "平台规则原文", "who": "火车行程需要变更的旅客", "ck": "2026-10-17", "a": "车还没开、原票也没改签过，一般先看改签，同样是要收钱的时段，改签费比退票费低一截。", "u": "题库/出行与旅游/0166.md"}, {"no": "0167", "t": "航班延误或取消，退票要不要手续费？", "d": "出行与旅游", "qt": "问答题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "法规原文", "who": "因航班取消或延误需要退票的旅客", "ck": "2026-10-07", "a": "不要。", "u": "题库/出行与旅游/0167.md"}, {"no": "0168", "t": "航班延误了，航空公司管不管吃住？", "d": "出行与旅游", "qt": "问答题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "法规原文", "who": "航班延误或备降的旅客", "ck": "2026-10-07", "a": "管不管，看延误出在哪一站、因为什么。", "u": "题库/出行与旅游/0168.md"}, {"no": "0169", "t": "没赶上火车，票还能改签或者退吗？", "d": "出行与旅游", "qt": "问答题", "lv": var order = {qt:["判断题","选择题","计算题","问答题"], lv:["简单","中等","困难"],
  g:["拿到钱","少花钱","省时间","避免损失","更安全健康"], b:["原文","官方解释","媒体转述"]};
keys.forEach(function(k){
  var vals = [];
  DATA.forEach(function(x){ if (x[k] && vals.indexOf(x[k]) < 0) vals.push(x[k]); });
  if (order[k]) vals.sort(function(a,b){ return order[k].indexOf(a) - order[k].indexOf(b); });
  var s = document.getElementById(k);
  vals.forEach(function(v){ var o = document.createElement("option"); o.value = v; o.textContent = v; s.appendChild(o); });
  s.addEventListener("change", draw);
});
document.getElementById("q").addEventListener("input", draw);
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function draw(){
  var q = document.getElementById("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var sel = {}; keys.forEach(function(k){ sel[k] = document.getElementById(k).value; });
  var list = document.getElementById("list"); list.innerHTML = "";
  var n = 0;
  DATA.forEach(function(x){
    for (var i = 0; i < keys.length; i++) if (sel[keys[i]] && x[keys[i]] !== sel[keys[i]]) return;
    var hay = (x.t + " " + x.a).toLowerCase();
    for (var j = 0; j < q.length; j++) if (hay.indexOf(q[j]) < 0) return;
    n++;
    var li = el("li"); var a = el("a", "", x.t); a.href = x.u; li.appendChild(a);
    li.appendChild(el("div", "m", "第 " + x.no + " 题 · " + x.d + " · " + x.qt + " · " + x.lv + " · " + x.g));
    li.appendChild(el("p", "a", x.a));
    li.appendChild(el("div", "m", "依据：" + x.bw + " · 核对于 " + x.ck + " · " + x.who));
    list.appendChild(li);
  });
  document.getElementById("n").textContent = "找到 " + n + " 道";
}
draw();
</script>
