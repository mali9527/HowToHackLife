个税与常见税费/0053.md"}, {"no": "0054", "t": "租房怎么少交个税？每月能扣多少？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "租房的居民个人", "ck": "2026-10-06", "a": "你和配偶在上班城市都没房、这一年都没扣房贷利息，签合同的人每月按城市扣800、1100或1500元，夫妻同城只扣一份。", "u": "题库/个税与常见税费/0054.md"}, {"no": "0055", "t": "有房贷，每月能抵多少税？能抵多少年？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "有首套房贷的居民个人", "ck": "2026-10-06", "a": "首套房贷每月从要交税的收入里减1000元，不是少交1000元税。", "u": "题库/个税与常见税费/0055.md"}, {"no": "0056", "t": "赡养父母能抵多少税？兄弟姐妹之间怎么分？", "d": "个税与常见税费", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "赡养父母、申报综合所得的居民个人", "ck": "2026-10-06", "a": "父母有一位满60岁，独生子女每月扣3000元。", "u": "题库/个税与常见税费/0056.md"}, {"no": "0057", "t": "夫妻俩，孩子的扣除一个人全拿还是各拿一半更省？", "d": "个税与常见税费", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "法规原文", "who": "可享受子女教育扣除的居民个人夫妻", "ck": "2026-10-06", "a": "要算：把全给你、各扣一半、全给对方时两人全年的税加起来比，选最少的。", "u": "题库/个税与常见税费/0057.md"}, {"no": "0058", "t": "一年看病自己掏了不少钱，怎么抵税？", "d": "个税与常见税费", "qt": "问答题", "lv": "中等", "g": "少花钱", "b": "原文", "bw": "官方文件原文", "who": "有综合所得的居民个人", "ck": "2026-10-06", "a": "你、配偶、未成年子女的医药费，每人一年医保报销后目录内自付超过15000元的部分，第二年汇算时能扣，最多80000元。", "u": "题库/个税与常见税费/0058.md"}, {"no": "0059", "t": "个税的扣除项忘了填，怎么补？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "漏填专项附加扣除的居民个人", "ck": "2026-10-06", "a": "能补。", "u": "题库/个税与常见税费/0059.md"}, {"no": "0060", "t": "每年的个税汇算，我要不要办？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "取得境内综合所得的居民个人", "ck": "2026-10-06", "a": "不一定。", "u": "题库/个税与常见税费/0060.md"}, {"no": "0061", "t": "个税汇算多缴的税，怎么申请退回来？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "办综合所得汇算的居民个人", "ck": "2026-10-06", "a": "次年3月1日到6月30日，在个税APP上办汇算，申请退多交的差额。", "u": "题库/个税与常见税费/0061.md"}, {"no": "0062", "t": "做兼职被预扣了 20% 的税，怎么退回来？", "d": "个税与常见税费", "qt": "问答题", "lv": "简单", "g": "拿到钱", "b": "原文", "bw": "法规原文", "wh ": "题库/消费与合同/0079.md"}, {"no": "0080", "t": "买到假药、劣药，能赔多少？", "d": "消费与合同", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "为自己或者家人生活消费买到假药、劣药的人", "ck": "2026-10-17", "a": "损失照赔，另加药钱十倍或损失三倍，加的不足1000元按1000元。", "u": "题库/消费与合同/0080.md"}, {"no": "0081", "t": "用的东西有缺陷把人伤了，能要哪些赔偿？", "d": "消费与合同", "qt": "问答题", "lv": "中等", "g": "拿到钱", "b": "原文", "bw": "法规原文", "who": "因缺陷产品受到人身伤害的人及死亡受害人的近亲属", "ck": "2026-10-17", "a": "治病康复花的合理费用和误工少挣的钱都能要。", "u": "题库/消费与合同/0081.md"}, {"no": "0082", "t": "被商家坑了，去 12315 该投诉还是举报？", "d": "消费与合同", "qt": "问答题", "lv": "简单", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "与商家发生消费争议的人", "ck": "2026-10-17", "a": "想让商家给你一个说法、解决你自己的生活消费纠纷，选投诉；想让监管部门查商家违法，选举报。", "u": "题库/消费与合同/0082.md"}, {"no": "0083", "t": "签满两次固定期限合同，第三次公司不签无固定期限合同，我能要什么？", "d": "程序员专题", "qt": "问答题", "lv": "困难", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "连续两次固定期限合同后被单位拒签的职工", "ck": "2026-10-17", "a": "符合条件又提出续签的，公司违法拒签还接着用你，从该签那天起每月两倍工资；拿到期让你走，你可以要求回去，或者要 2N。", "u": "题库/程序员专题/0083.md"}, {"no": "0084", "t": "就业报到证取消了，毕业手续现在怎么办？", "d": "上学资助与职业资格", "qt": "问答题", "lv": "中等", "g": "省时间", "b": "原文", "bw": "官方文件原文", "who": "普通高校毕业生", "ck": "2026-10-07", "a": "报到证不用补，也不用改派了。", "u": "题库/上学资助与职业资格/0084.md"}, {"no": "0085", "t": "换了工作，人事档案要不要跟着转？", "d": "上学资助与职业资格", "qt": "问答题", "lv": "中等", "g": "避免损失", "b": "原文", "bw": "官方文件原文", "who": "换工作或跨地区就业，需要判断是否迁转人事档案的人", "ck": "2026-10-17", "a": "不一定。", "u": "题库/上学资助与职业资格/0085.md"}, {"no": "0086", "t": "结婚登记必须回户籍地、带户口簿吗？", "d": "婚姻生育养育", "qt": "问答题", "lv": "简单", "g": "省时间", "b": "官方解释", "bw": "主管部门的答复和解读", "who": "准备登记结婚的内地居民", "ck": "2026-10-07", "a": "不用。", "u": "题库/婚姻生育养育/0086.md"}, {"no": "0087", "t": "父母出钱给我买房，离婚时这套房怎么分？", "d": "婚姻生育养育", "qt": "问答题", "lv": "困难", "g": "避免损失", "b": "原文", "bw": "法规原文", "who": "父母出资购房的已婚子女", "ck": "2026-10-07", "a": "婚后你父母全款买的，当时没约定或没说清送给谁，法院可以把房判给你，补不补对方、补多少由法院定，不是自动对半分。", "u": "题库/婚姻生育养育/0087.md"}, {"no": "0088", "t": "婚前买的房，婚后加了对方的名字，离婚时怎么分？", "d": "婚姻生育养育", "qt": "问答题", "lv": "中等", "g": "避免损失
