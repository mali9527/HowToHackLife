<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1710 800" role="img"><title>人生黑客：按收益和功夫找事做</title><rect width="1710" height="800" fill="#f6f8fa" /><text x="24" y="38" fill="#1f2328" font-size="28" font-family="sans-serif">人生黑客 · 做了能得到什么</text><text x="110" y="85" fill="#1f2328" font-size="20" font-family="sans-serif">多拿：多拿一笔钱</text><text x="430" y="85" fill="#1f2328" font-size="20" font-family="sans-serif">少交：少交一笔钱</text><text x="750" y="85" fill="#1f2328" font-size="20" font-family="sans-serif">别亏：别白白损失</text><text x="1070" y="85" fill="#1f2328" font-size="20" font-family="sans-serif">少跑：少跑冤枉路</text><text x="1390" y="85" fill="#1f2328" font-size="20" font-family="sans-serif">安全：家里更安全</text><text x="16" y="145" fill="#1f2328" font-size="18" font-family="sans-serif">几分钟</text><rect x="100" y="110" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="110" y="144" fill="#1f2328" font-size="24" font-family="sans-serif">3 道</text><text x="110" y="175" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0061"><tspan x="110" dy="0">多交的个税，你办年度汇算就能申请退</tspan><tspan x="110" dy="21">回</tspan></text><text x="110" y="303" fill="#1f2328" font-size="14" font-family="sans-serif">第 0061 题</text><rect x="420" y="110" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="430" y="144" fill="#1f2328" font-size="24" font-family="sans-serif">21 道</text><text x="430" y="175" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0223"><tspan x="430" dy="0">你用职工医保看普通门诊，医保范围内</tspan><tspan x="430" dy="21">报销比例不低于50%</tspan></text><text x="430" y="303" fill="#1f2328" font-size="14" font-family="sans-serif">第 0223 题</text><rect x="740" y="110" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="750" y="144" fill="#1f2328" font-size="24" font-family="sans-serif">34 道</text><text x="750" y="175" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0092"><tspan x="750" dy="0">你在同一家银行的存款本息，50万元</tspan><tspan x="750" dy="21">以内存款保险全赔</tspan></text><text x="750" y="303" fill="#1f2328" font-size="14" font-family="sans-serif">第 0092 题</text><rect x="1060" y="110" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="1070" y="144" fill="#1f2328" font-size="24" font-family="sans-serif">2 道</text><text x="1070" y="175" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0046"><tspan x="1070" dy="0">你哪年哪月到法定退休年龄，电子社保</tspan><tspan x="1070" dy="21">卡就能查</tspan></text><text x="1070" y="303" fill="#1f2328" font-size="14" font-family="sans-serif">第 0046 题</text><rect x="1380" y="110" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="1390" y="144" fill="#1f2328" font-size="24" font-family="sans-serif">17 道</text><text x="1390" y="175" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0033"><tspan x="1390" dy="0">你家食物存得更安全：用温度计确认冷</tspan><tspan x="1390" dy="21">藏室0℃～4℃</tspan></text><text x="1390" y="303" fill="#1f2328" font-size="14" font-family="sans-serif">第 0033 题</text><text x="16" y="365" fill="#1f2328" font-size="18" font-family="sans-serif">办一次</text><rect x="100" y="330" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="110" y="364" fill="#1f2328" font-size="24" font-family="sans-serif">24 道</text><text x="110" y="395" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0043"><tspan x="110" dy="0">被裁后你符合条件就能领失业金，超过</tspan><tspan x="110" dy="21">60日也能申请</tspan></text><text x="110" y="523" fill="#1f2328" font-size="14" font-family="sans-serif">第 0043 题</text><rect x="420" y="330" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="430" y="364" fill="#1f2328" font-size="24" font-family="sans-serif">16 道</text><text x="430" y="395" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0056"><tspan x="430" dy="0">你是独生子女，父母有一位满60岁，</tspan><tspan x="430" dy="21">每月3000元收入不用交税</tspan></text><text x="430" y="523" fill="#1f2328" font-size="14" font-family="sans-serif">第 0056 题</text><rect x="740" y="330" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="750" y="364" fill="#1f2328" font-size="24" font-family="sans-serif">71 道</text><text x="750" y="395" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0050"><tspan x="750" dy="0">公司不报，你能在受伤之日起1年内自</tspan><tspan x="750" dy="21">己申请工伤认定</tspan></text><text x="750" y="523" fill="#1f2328" font-size="14" font-family="sans-serif">第 0050 题</text><rect x="1060" y="330" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="1070" y="364" fill="#1f2328" font-size="24" font-family="sans-serif">15 道</text><text x="1070" y="395" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0001"><tspan x="1070" dy="0">配偶、子女、父母能免公证取存款，同</tspan><tspan x="1070" dy="21">一银行不超5万元且符合条件</tspan></text><text x="1070" y="523" fill="#1f2328" font-size="14" font-family="sans-serif">第 0001 题</text><rect x="1380" y="330" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="1390" y="364" fill="#1f2328" font-size="24" font-family="sans-serif">7 道</text><text x="1390" y="395" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0325"><tspan x="1390" dy="0">查清甲醛是否超标，你看1小时平均是</tspan><tspan x="1390" dy="21">否高于0.08 mg/m³</tspan></text><text x="1390" y="523" fill="#1f2328" font-size="14" font-family="sans-serif">第 0325 题</text><text x="16" y="585" fill="#1f2328" font-size="18" font-family="sans-serif">要交涉</text><rect x="100" y="550" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="110" y="584" fill="#1f2328" font-size="24" font-family="sans-serif">48 道</text><text x="110" y="615" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0004"><tspan x="110" dy="0">买东西被商家骗，你能要价款三倍的加</tspan><tspan x="110" dy="21">赔，最低500元</tspan></text><text x="110" y="743" fill="#1f2328" font-size="14" font-family="sans-serif">第 0004 题</text><rect x="420" y="550" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="430" y="584" fill="#1f2328" font-size="24" font-family="sans-serif">5 道</text><text x="430" y="615" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0069"><tspan x="430" dy="0">殡仪馆标价外加的钱、强塞服务的钱，</tspan><tspan x="430" dy="21">你不用交</tspan></text><text x="430" y="743" fill="#1f2328" font-size="14" font-family="sans-serif">第 0069 题</text><rect x="740" y="550" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="750" y="584" fill="#1f2328" font-size="24" font-family="sans-serif">86 道</text><text x="750" y="615" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0003"><tspan x="750" dy="0">你收货六个月内发现电脑、冰箱有毛病</tspan><tspan x="750" dy="21">，争起来商家拿证据</tspan></text><text x="750" y="743" fill="#1f2328" font-size="14" font-family="sans-serif">第 0003 题</text><rect x="1060" y="550" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="1070" y="584" fill="#1f2328" font-size="24" font-family="sans-serif">1 道</text><text x="1070" y="615" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0351"><tspan x="1070" dy="0">你取消接收，商家就得立即停发营销短</tspan><tspan x="1070" dy="21">信、停打推销电话</tspan></text><text x="1070" y="743" fill="#1f2328" font-size="14" font-family="sans-serif">第 0351 题</text><rect x="1380" y="550" width="305" height="208" rx="12" fill="white" stroke="#d0d7de" /><text x="1390" y="584" fill="#1f2328" font-size="24" font-family="sans-serif">1 道</text><text x="1390" y="615" fill="#1f2328" font-size="16" font-family="sans-serif" data-no="0298"><tspan x="1390" dy="0">邻居噪音扰民，你有权请物业出面劝阻</tspan><tspan x="1390" dy="21">调解</tspan></text><text x="1390" y="743" fill="#1f2328" font-size="14" font-family="sans-serif">第 0298 题</text></svg>
